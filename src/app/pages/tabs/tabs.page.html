<ion-tabs>
  <ion-router-outlet></ion-router-outlet>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="game" [routerLink]="['/tabs', characterId, 'game']">
      <ion-icon name="game-controller-outline"></ion-icon>
      <ion-label>Game</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="inventory" [routerLink]="['/tabs', characterId, 'inventory']">
      <ion-icon name="bag-outline"></ion-icon>
      <ion-label>Inventory</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="editor" [routerLink]="['/tabs', characterId, 'editor']">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Editor</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="last-time" [routerLink]="['/tabs', characterId, 'last-time']">
      <ion-icon name="time-outline"></ion-icon>
      <ion-label>Last Time</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
