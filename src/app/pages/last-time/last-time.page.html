<div class="content-container standard-page">
  <div class="page-header">
    <h1 class="retro-header">Last Time In MYTHOS</h1>
    <div class="retro-text">We last saw our {{ roleLabel }}...</div>
  </div>

  <div *ngIf="loading" class="loading"><span>Loading...</span></div>
  <div *ngIf="error" class="error"><span>{{ error }}</span></div>

  <div *ngIf="!loading && !error" class="card story-frame story-frame--img">
    <div class="story-frame__content">
      <ol class="history-list">
        <li *ngFor="let e of entries; let i = index" class="history-item">
          <div class="event-row">
            <div class="event-body">
              <div class="event-node">
                <div class="story-text" *ngIf="e.nodeContent; else noContent" [innerHTML]="e.nodeContent"></div>
                <ng-template #noContent>
                  <div class="retro-text" style="opacity:0.8">(content unavailable)</div>
                </ng-template>
              </div>
              <div class="event-choice">You chose: “{{ e.choiceText || 'Unknown option' }}”</div>
              <div class="event-time" *ngIf="e.timestamp">at {{ e.timestamp | date:'short' }}</div>
            </div>
          </div>
        </li>
      </ol>

      <div class="actions" style="display:flex; gap:12px; margin-top: 12px;">
        <button class="btn-secondary" (click)="backToGame()">Back to Game</button>
      </div>
    </div>
  </div>
</div>

<app-bottom-tabs [characterId]="characterId"></app-bottom-tabs>
