<ion-header>
  <ion-toolbar class="retro-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/character-select" class="back-button"></ion-back-button>
    </ion-buttons>
    <ion-title class="retro-header">Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="retro-content">
  <div class="app-container content-container">
    <h1 class="page-header">Account Settings</h1>
    
    <!-- Loading state -->
    <div *ngIf="loading" class="loading-container">
      <div class="retro-text">Loading...</div>
      <div class="pixel-loader"></div>
    </div>
    
    <!-- Error state -->
    <div *ngIf="error" class="error-container">
      <div class="retro-text error-text">{{ error }}</div>
      <button class="pixel-button" (click)="loadAccountData()">Retry</button>
    </div>
    
    <!-- Account Info -->
    <div *ngIf="!loading && !error" class="account-section">
      <div class="pixel-art-container">
        <div class="pixel-art-avatar"></div>
      </div>

      <form [formGroup]="profileForm" (ngSubmit)="updateProfile()" class="profile-form card">
        <!-- Username Field -->
        <div class="form-group">
          <label class="retro-label">Username</label>
          <input type="text" formControlName="username" class="form-input" [readonly]="!editMode" />
          <div *ngIf="profileForm.get('username')?.invalid && profileForm.get('username')?.touched" class="error-text">
            Username must be 3-20 characters
          </div>
        </div>
        
        <!-- Email Field -->
        <div class="form-group">
          <label class="retro-label">Email</label>
          <input type="email" formControlName="email" class="form-input" [readonly]="!editMode" />
          <div *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched" class="error-text">
            Please enter a valid email
          </div>
        </div>
        
        <!-- Password Fields (only shown in edit mode) -->
        <div *ngIf="editMode" class="form-group">
          <label class="retro-label">New Password</label>
          <input type="password" formControlName="password" class="form-input" />
          <div *ngIf="profileForm.get('password')?.invalid && profileForm.get('password')?.touched" class="error-text">
            Password must be at least 6 characters
          </div>
        </div>
        
        <div *ngIf="editMode" class="form-group">
          <label class="retro-label">Confirm Password</label>
          <input type="password" formControlName="confirmPassword" class="form-input" />
          <div *ngIf="passwordsDoNotMatch()" class="error-text">
            Passwords do not match
          </div>
        </div>
        
        <!-- Account Stats -->
        <div class="account-stats card">
          <div class="stat-item">
            <span class="retro-label">Account Created:</span>
            <span class="retro-text">{{ accountCreatedDate }}</span>
          </div>
          <div class="stat-item">
            <span class="retro-label">Characters:</span>
            <span class="retro-text">{{ characterCount }}</span>
          </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="action-buttons">
          <button *ngIf="!editMode" type="button" class="btn-secondary" (click)="toggleEditMode()">
            Edit Profile
          </button>
          <button *ngIf="editMode" type="submit" class="btn-primary" [disabled]="profileForm.invalid || passwordsDoNotMatch()">
            Save Changes
          </button>
          <button *ngIf="editMode" type="button" class="btn-secondary" (click)="cancelEdit()">
            Cancel
          </button>
          <button *ngIf="!editMode" type="button" class="btn-secondary" (click)="goToThemeSelect()">
            Theme Settings
          </button>
          <button type="button" class="btn-danger logout-btn" (click)="this.logout()">
            Logout
          </button>
        </div>
      </form>
    </div>
    
    <!-- Audio Controls Section -->
    <div class="audio-controls card" *ngIf="!loading && !error">
      <h2 class="section-header">Audio Settings</h2>
      <div class="form-group">
        <label class="retro-label">Master Volume</label>
        <ion-range [value]="masterVolume" (ionChange)="setMasterVolume($event.detail.value)" min="0" max="1" step="0.01">
          <ion-icon slot="start" name="volume-low"></ion-icon>
          <ion-icon slot="end" name="volume-high"></ion-icon>
        </ion-range>
      </div>
      <div class="form-group">
        <label class="retro-label">Music Volume</label>
        <ion-range [value]="musicVolume" (ionChange)="setMusicVolume($event.detail.value)" min="0" max="1" step="0.01">
          <ion-icon slot="start" name="musical-notes"></ion-icon>
          <ion-icon slot="end" name="musical-notes"></ion-icon>
        </ion-range>
      </div>
      <div class="form-group">
        <label class="retro-label">SFX Volume</label>
        <ion-range [value]="sfxVolume" (ionChange)="setSfxVolume($event.detail.value)" min="0" max="1" step="0.01">
          <ion-icon slot="start" name="flame"></ion-icon>
          <ion-icon slot="end" name="flash"></ion-icon>
        </ion-range>
      </div>
      <div class="form-group">
        <button type="button" class="btn-secondary" [class.muted]="isMuted" (click)="toggleMute()">
          {{ isMuted ? 'Unmute All' : 'Mute All' }}
        </button>
      </div>
    </div>
  </div>
</ion-content>
<app-secondary-bottom-tabs></app-secondary-bottom-tabs>
