<ion-content class="retro-content" [fullscreen]="true" (click)="onBackgroundClick($event)">
  <div class="pixel-container" style="padding-bottom: 150px; margin-bottom: 50px;">
    <h1 class="retro-header">Character Select</h1>
    <div class="welcome-message retro-text">Welcome, {{username}}!</div>
    
    <!-- Loading state -->
    <div *ngIf="loading" class="loading-container">
      <div class="retro-text">Loading...</div>
      <div class="pixel-loader"></div>
    </div>
    
    <!-- Error state -->
    <div *ngIf="error" class="error-container">
      <div class="retro-text error-text">{{ error }}</div>
      <div class="error-buttons">
        <button class="pixel-button retry-btn" (click)="ngOnInit()">Retry</button>
        <button class="pixel-button cancel-btn" (click)="clearError()">Cancel</button>
      </div>
    </div>
    
    <!-- No characters state -->
    <div *ngIf="!loading && !error && characters.length === 0" class="empty-state">
      <div class="pixel-art-container">
        <div class="pixel-art-character empty-slot"></div>
      </div>
      <div class="retro-text">No characters found</div>
      <div class="retro-text hint-text">Begin your first adventure!</div>
      <button class="pixel-button create-btn" (click)="createCharacter()">
        Start
      </button>
    </div>
    
    <!-- Character list -->
    <div *ngIf="!loading && !error && characters.length > 0" class="character-list">
      <!-- Character actions -->
      <div *ngIf="selectedCharacter" class="character-actions">
        <!-- Show different actions based on character status -->
        <ng-container *ngIf="!selectedCharacter.is_dead">
          <button class="pixel-button play-btn" (click)="playCharacter(selectedCharacter)">Play</button>
          <button class="pixel-button delete-btn" (click)="deleteCharacter(selectedCharacter)">Kill</button>
        </ng-container>
        <ng-container *ngIf="selectedCharacter.is_dead">
         
         
          <button class="pixel-button grave-btn" (click)="viewGrave(selectedCharacter)">View Grave</button>
        </ng-container>
      </div>
      <div class="characters-grid">
        <div *ngFor="let character of characters" 
             class="character-card" 
             [class.selected]="selectedCharacter?.id === character.id"
             (click)="onCharacterClick(character)">
          <div class="pixel-art-container">
            <div class="pixel-art-character" 
                 [ngClass]="[(character.className || character.class || 'Warrior')?.toLowerCase(), character.is_dead ? 'dead' : '']"></div>

            <!-- Profile icon overlay: alive shows character.icon_key if present; dead shows skullcrossbones; centered within a 2x frame -->
            <div class="character-icon-overlay">
              <!-- Show character icon if alive and has icon_key -->
              <ng-container *ngIf="!character.is_dead && character.icon_key">
                <div class="sprite-center-abs sprite-frame-2x" style="--sprite-nudge-x: 2px;">
                  <span class="sprite-2x-center" [ngClass]="'icon-' + character.icon_key"></span>
                </div>
              </ng-container>
              <!-- Dead shows skullcrossbones -->
              <ng-container *ngIf="character.is_dead">
                <div class="sprite-center-abs sprite-frame-2x" style="--sprite-nudge-x: 2px;">
                  <span class="icon-skullcrossbones sprite-2x-center"></span>
                </div>
              </ng-container>
            </div>

            <!-- Play icon overlay for selected living characters -->
            <div *ngIf="selectedCharacter?.id === character.id && !character.is_dead" 
                 class="character-play-overlay"
                 (click)="onPlayIconClick(character, $event)">
              <div class="play-icon"></div>
            </div>
            
            <!-- Grave icon overlay for selected dead characters -->
            <div *ngIf="selectedCharacter?.id === character.id && character.is_dead" 
                 class="character-grave-overlay"
                 (click)="onGraveIconClick(character, $event)">
                 <div class="grave-header center-children">
                  <span class="icon-grave sprite-2x-center"></span>
                </div>               
               </div>
          </div>
          <div class="character-info">
            <div class="character-name">{{ character.name }}</div>
            <div class="character-details">
              <span>Lvl {{ character.level || 1 }}</span>
              <span>{{ character.className || character.class || 'Adventurer' }}</span>
            </div>
          </div>
        </div>
        
        <!-- Create new character card -->
        <div class="character-card new-character" (click)="createCharacter()">
          <div class="pixel-art-container">
            <div class="pixel-art-character empty-slot"></div>
          </div>
          <div class="character-info">
            <div class="character-name">New Character</div>
            <div class="character-details">
              <span>Create</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Bottom spacer to prevent content from being cut off by menu -->
  </div>
</ion-content>
<app-secondary-bottom-tabs></app-secondary-bottom-tabs>
