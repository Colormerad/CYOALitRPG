<ion-tab-bar slot="bottom" class="app-bottom-tabs">
  <ion-tab-button [routerLink]="['/game', characterId]">
    <ion-icon name="game-controller-outline"></ion-icon>
    <ion-label>Game</ion-label>
  </ion-tab-button>
  <ion-tab-button [routerLink]="['/inventory', characterId]">
    <ion-icon name="bag-outline"></ion-icon>
    <ion-label>Inventory</ion-label>
  </ion-tab-button>
  <ion-tab-button [routerLink]="['/character-editor', characterId]">
    <ion-icon name="person-outline"></ion-icon>
    <ion-label>Editor</ion-label>
  </ion-tab-button>
  <ion-tab-button [routerLink]="['/profile']">
    <ion-icon name="person-circle-outline"></ion-icon>
    <ion-label>Profile</ion-label>
  </ion-tab-button>
</ion-tab-bar>
