<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Test Login API</h1>
    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email">
    </div>
    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password">
    </div>
    <button onclick="testLogin()">Login</button>
    <div id="result">Results will appear here...</div>

    <script>
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            if (!email || !password) {
                resultDiv.innerHTML = 'Please enter both email and password';
                return;
            }
            
            resultDiv.innerHTML = 'Sending login request...';
            
            try {
                // Test local backend first
                try {
                    const localResponse = await fetch('http://localhost:3000/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });
                    
                    const localData = await localResponse.json();
                    resultDiv.innerHTML += '<h3>Local Backend Response:</h3>' +
                        '<p>Status: ' + localResponse.status + ' ' + localResponse.statusText + '</p>' +
                        '<pre>' + JSON.stringify(localData, null, 2) + '</pre>';
                } catch (localError) {
                    resultDiv.innerHTML += '<h3>Local Backend Error:</h3>' +
                        '<pre>' + localError.toString() + '</pre>';
                }
                
                // Now test production backend
                const prodResponse = await fetch('https://api.mythosgame.app/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const prodData = await prodResponse.json();
                resultDiv.innerHTML += '<h3>Production Backend Response:</h3>' +
                    '<p>Status: ' + prodResponse.status + ' ' + prodResponse.statusText + '</p>' +
                    '<pre>' + JSON.stringify(prodData, null, 2) + '</pre>';
                
            } catch (error) {
                resultDiv.innerHTML += '<h3>Error:</h3>' +
                    '<pre>' + error.toString() + '</pre>';
            }
        }
    </script>
</body>
</html>
